name: Build Geode Mod

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

jobs:
  # ---------------------------------------------------------------------------
  # Windows only. Standalone: produces its own .geode and does NOT depend on any
  # other platform building successfully. Use this one first.
  # ---------------------------------------------------------------------------
  windows:
    name: Windows (.geode)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build the mod
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: latest
          target: Win64

      - name: Upload .geode
        uses: actions/upload-artifact@v4
        with:
          name: Windows-geode
          path: ${{ steps.build.outputs.build-output }}

  # ---------------------------------------------------------------------------
  # Every platform, combined into one multi-platform .geode. Each platform is
  # allowed to fail without blocking the Windows job above.
  # ---------------------------------------------------------------------------
  build:
    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Windows
            os: windows-latest
          - name: macOS
            os: macos-latest
          - name: Android32
            os: ubuntu-latest
            target: Android32
          - name: Android64
            os: ubuntu-latest
            target: Android64

    steps:
      - uses: actions/checkout@v4

      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: latest
          combine: true
          target: ${{ matrix.config.target }}

  package:
    name: Package builds
    runs-on: ubuntu-latest
    needs: ["build"]

    steps:
      - uses: geode-sdk/build-geode-mod/combine@main
        id: combine

      - uses: actions/upload-artifact@v4
        with:
          name: Build Output
          path: ${{ steps.combine.outputs.build-output }}
